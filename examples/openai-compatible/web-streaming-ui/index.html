<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Streaming chat — OpenAI-compatible sample</title>
    <style>
      :root {
        --bg: #101418;
        --panel: #1a2027;
        --border: #2c3540;
        --text: #e6eaee;
        --muted: #8b98a5;
        --accent: #4da3ff;
        --ok: #35c07e;
        --warn: #e6b450;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0.75rem 1.25rem;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
      }
      header h1 { font-size: 1rem; margin: 0; font-weight: 600; }
      .metrics { display: flex; gap: 1rem; margin-left: auto; }
      .metric {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        line-height: 1.2;
      }
      .metric .label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
      .metric .value { font-size: 1rem; font-variant-numeric: tabular-nums; color: var(--accent); }
      .badge {
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        padding: 0.25rem 0.6rem;
        border-radius: 999px;
        border: 1px solid var(--warn);
        color: var(--warn);
        display: none;
      }
      .badge.visible { display: inline-block; }
      #settings-toggle {
        background: none;
        border: 1px solid var(--border);
        color: var(--muted);
        border-radius: 6px;
        padding: 0.35rem 0.7rem;
        cursor: pointer;
      }
      #settings-toggle:hover { color: var(--text); }
      #settings {
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        padding: 1rem 1.25rem;
        display: none;
        gap: 1rem;
        flex-wrap: wrap;
      }
      #settings.open { display: flex; }
      #settings .field { display: flex; flex-direction: column; gap: 0.25rem; flex: 1 1 200px; }
      #settings label { font-size: 0.75rem; color: var(--muted); }
      #settings input[type="text"], #settings input[type="password"] {
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 6px;
        padding: 0.4rem 0.6rem;
        font-size: 0.85rem;
      }
      #settings .mock-field {
        flex-direction: row;
        align-items: center;
        gap: 0.5rem;
        align-self: flex-end;
      }
      main { flex: 1; overflow-y: auto; padding: 1.25rem; display: flex; flex-direction: column; gap: 0.75rem; }
      .msg {
        max-width: 75%;
        padding: 0.6rem 0.9rem;
        border-radius: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .msg.user { align-self: flex-end; background: #2b4a68; }
      .msg.assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }
      .msg.assistant .cursor { display: inline-block; width: 0.55em; animation: blink 0.9s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      #error {
        display: none;
        margin: 0 1.25rem;
        padding: 0.6rem 0.9rem;
        border: 1px solid #d05050;
        border-radius: 8px;
        color: #ff9d9d;
        background: #2a1618;
        font-size: 0.85rem;
      }
      #error.visible { display: block; }
      form {
        display: flex;
        gap: 0.5rem;
        padding: 1rem 1.25rem;
        border-top: 1px solid var(--border);
        background: var(--panel);
      }
      #prompt {
        flex: 1;
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 8px;
        padding: 0.6rem 0.8rem;
        font-size: 0.95rem;
        resize: none;
        font-family: inherit;
      }
      #send {
        background: var(--accent);
        color: #06121f;
        font-weight: 600;
        border: none;
        border-radius: 8px;
        padding: 0 1.4rem;
        cursor: pointer;
      }
      #send:disabled { opacity: 0.5; cursor: wait; }
    </style>
  </head>
  <body>
    <header>
      <h1>Streaming chat</h1>
      <span id="mock-badge" class="badge" role="status" aria-label="mock mode indicator">MOCK</span>
      <div class="metrics">
        <div class="metric">
          <span class="label">TTFT</span>
          <span class="value" id="ttft" title="Time to first token">—</span>
        </div>
        <div class="metric">
          <span class="label">Tokens/sec</span>
          <span class="value" id="tps" title="Tokens per second">—</span>
        </div>
      </div>
      <button id="settings-toggle" type="button" aria-controls="settings">Settings</button>
    </header>

    <section id="settings" aria-label="Endpoint settings">
      <div class="field">
        <label for="base-url">Base URL</label>
        <input id="base-url" type="text" autocomplete="off" spellcheck="false" />
      </div>
      <div class="field">
        <label for="api-key">API key</label>
        <input id="api-key" type="password" autocomplete="off" />
      </div>
      <div class="field">
        <label for="model">Model</label>
        <input id="model" type="text" autocomplete="off" spellcheck="false" />
      </div>
      <div class="field mock-field">
        <input id="mock-toggle" type="checkbox" />
        <label for="mock-toggle">Mock stream</label>
      </div>
    </section>

    <main id="chat" aria-live="polite"></main>
    <div id="error" role="alert"></div>

    <form id="composer">
      <textarea id="prompt" rows="2" placeholder="Ask something…"></textarea>
      <button id="send" type="submit">Send</button>
    </form>

    <script type="module" src="./main.js"></script>
  </body>
</html>
